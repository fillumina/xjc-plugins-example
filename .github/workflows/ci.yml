# Runs the example on every push and pull request, and once a night against the latest commit of
# each of the three projects it imports. None of them is released yet, so their snapshots exist
# nowhere else, and what this example has to prove is that the current sources of the three work
# together inside one build.

name: CI

on:
  push:
  pull_request:
  schedule:
    # a few minutes past four, so a nightly run does not queue with everything else on the hour
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install the three plugins from their latest commits
      run: |
        git clone --depth 1 https://github.com/fillumina/cxf-validation-frontend
        git clone --depth 1 https://github.com/fillumina/xjc-bean-validation-plugin
        git clone --depth 1 https://github.com/fillumina/xjc-primitives-plugin
        mvn -B -DskipTests install --file cxf-validation-frontend/pom.xml
        mvn -B -DskipTests install --file xjc-bean-validation-plugin/pom.xml
        mvn -B -DskipTests install --file xjc-primitives-plugin/pom.xml

    - name: Build and test the example
      run: mvn -B verify --file pom.xml
