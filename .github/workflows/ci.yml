# Tests both consumer combinations separately on push, pull request, nightly and on demand. The
# three plugins are built from their latest commits and the example is told which version each of
# them carries, so a run tests the current sources and not the release the poms pin. Maven resolves
# the XJC 4 equals/hashCode plugin from Central.

name: CI

on:
  push:
  pull_request:
  schedule:
    # a few minutes past four, so a nightly run does not queue with everything else on the hour
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install the three plugins from their latest commits
      id: plugins
      run: |
        git clone --depth 1 https://github.com/fillumina/cxf-validation-frontend
        git clone --depth 1 https://github.com/fillumina/xjc-bean-validation-plugin
        git clone --depth 1 https://github.com/fillumina/xjc-primitives-plugin
        mvn -B -DskipTests install --file cxf-validation-frontend/pom.xml
        mvn -B -DskipTests install --file xjc-bean-validation-plugin/pom.xml
        mvn -B -DskipTests install --file xjc-primitives-plugin/pom.xml
        echo "cxf=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout --file cxf-validation-frontend/pom.xml)" >> "$GITHUB_OUTPUT"
        echo "bean=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout --file xjc-bean-validation-plugin/pom.xml)" >> "$GITHUB_OUTPUT"
        echo "primitives=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout --file xjc-primitives-plugin/pom.xml)" >> "$GITHUB_OUTPUT"

    - name: Test the three plugins in both XJC orders
      run: mvn -B clean verify -pl three-plugins -am --file pom.xml -Dcxf-validation-frontend.version=${ steps.plugins.outputs.cxf } -Dxjc-bean-validation-plugin.version=${ steps.plugins.outputs.bean } -Dxjc-primitives-plugin.version=${ steps.plugins.outputs.primitives }

    - name: Test primitives before equals and hashCode
      run: mvn -B clean verify -pl equals-hashcode -am --file pom.xml -Dcxf-validation-frontend.version=${ steps.plugins.outputs.cxf } -Dxjc-bean-validation-plugin.version=${ steps.plugins.outputs.bean } -Dxjc-primitives-plugin.version=${ steps.plugins.outputs.primitives }
